name: Documentation Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

  # 'workflow_dispatch' allows manual execution of this workflow under the repository's 'Actions' tab
  workflow_dispatch:

jobs:
  build-doc:
    name: Build documentation HTML page 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "docs"
          pre-build-command: "pip install -r docs/requirements.txt --upgrade pip"

      # Create an artifact of the HTML output
      - uses: actions/upload-artifact@v7
        with:
          name: documentation_html
          path: docs/_build/html/
